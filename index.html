<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Çalışma</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:min(500px,100%);padding:34px 25px;text-align:center}.small{font-size:11px;letter-spacing:3px;color:#777}h1{font-size:34px;margin:14px 0 24px}p{color:#c8c8c8;line-height:1.65;margin:0}button{appearance:none;border:0;background:#fff;color:#111;border-radius:14px;padding:15px 25px;font-size:15px;font-weight:700;margin-top:27px;width:100%;cursor:pointer}button:disabled{opacity:.55}.loading{height:4px;background:#222;border-radius:9px;margin:30px 0 14px;overflow:hidden}.bar{height:100%;width:0;background:#fff;transition:width 2s}.result{font-size:21px;line-height:1.55;font-weight:650;margin:25px 0}input{width:100%;padding:15px;border:1px solid #333;background:#151515;color:#fff;border-radius:13px;font-size:17px;margin-top:22px}.note{font-size:12px;color:#777;margin-top:14px}.hidden{display:none}</style></head><body><main class="card"><section id="one"><div class="small">ERİŞİM SAĞLANDI</div><h1>ÇALIŞMA</h1><p>Bu dosyanın amacı oldukça basit.<br>Seni biraz şaşırtmak.</p><button onclick="begin()">BAŞLAT</button></section><section id="two" class="hidden"><div class="small">ANALİZ EDİLİYOR...</div><div class="loading"><div id="bar" class="bar"></div></div><div id="pct" class="note">0%</div></section><section id="three" class="hidden"><div class="small">SONUÇ BULUNDU</div><div class="result">Tekrar, zamanın nasıl geçtiğini anlamadığımız, bol kahkahalı bir geceye ne dersin? 🥂</div><p>Tarih seçimi tamamen sana bırakılmıştır.</p><input id="date" type="date"><button id="sendBtn" onclick="saveDate()">TARİHİMİ SEÇİYORUM</button><div id="status" class="note"></div></section></main><script>function begin(){document.getElementById('one').classList.add('hidden');document.getElementById('two').classList.remove('hidden');const bar=document.getElementById('bar'),pct=document.getElementById('pct');setTimeout(()=>bar.style.width='100%',80);let n=0;const timer=setInterval(()=>{n+=5;pct.textContent=n+'%';if(n>=100){clearInterval(timer);setTimeout(()=>{document.getElementById('two').classList.add('hidden');document.getElementById('three').classList.remove('hidden')},450)}},100)}async function saveDate(){const d=document.getElementById('date').value,status=document.getElementById('status'),btn=document.getElementById('sendBtn');if(!d){status.textContent='Önce bir tarih seçmelisin. :)';return}const pretty=new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});btn.disabled=true;btn.textContent='KAYDEDİLİYOR...';status.textContent='';const payload={access_key:'a4eaa531-ad3b-450e-bc0c-27d520b5e529',subject:'DOSYA #02 — Buluşma Tarihi',from_name:'Çalışma',name:'Buluşma Tarihi',message:'DOSYA #02 tamamlandı.\n\nSeçilen buluşma tarihi: '+pretty};try{const response=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(data.success){localStorage.setItem('dosya02_tarih',pretty);status.innerHTML='Tarih kaydedildi. ✓<br><br>Gerisini ben hallederim. 😉';btn.textContent='TARİH KAYDEDİLDİ ✓'}else{console.error('Web3Forms:',data);status.textContent=(data.message||'Gönderim başarısız.')+' Lütfen tekrar dene.';btn.disabled=false;btn.textContent='TARİHİMİ SEÇİYORUM'}}catch(e){console.error(e);status.textContent='Bağlantı sorunu oluştu. Lütfen tekrar dene.';btn.disabled=false;btn.textContent='TARİHİMİ SEÇİYORUM'}}</script></body></html>
